name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest

    # A real Postgres to apply the migrations against. The isolation test suite
    # spins up its own throwaway containers via Testcontainers (Docker is
    # available on the runner) and does not use this service.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SUPERUSER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://mhandisi_owner:owner_local_dev@localhost:5432/mhandisi
      APP_DATABASE_URL: postgresql://app_runtime:app_local_dev@localhost:5432/mhandisi
      MAINTENANCE_DATABASE_URL: postgresql://maintenance:maintenance_local_dev@localhost:5432/mhandisi
      BETTER_AUTH_SECRET: ci-insecure-secret-not-used-in-production-0000
      BETTER_AUTH_URL: http://localhost:3000

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Bootstrap database roles
        run: npx tsx scripts/bootstrap-db.ts

      - name: Apply migrations
        run: npm run db:migrate

      - run: npm run lint

      - run: npm run typecheck

      - name: Isolation suite (Testcontainers)
        run: npm test

      - run: npm run build
