<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon — preview</title>
<style>body{margin:0;padding:16px;background:var(--mm-canvas);font-family:var(--mm-font-body);color:var(--mm-text)}</style></head>
<body>
<div id="root" style="display:flex;flex-wrap:wrap;gap:18px;color:var(--mm-charcoal-900)"></div>
<script>
var M = window.MhandisiMakini, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, M.icons.map(function (n) {
  return h('span', { key: n, title: n, style: { display: 'grid', placeItems: 'center', width: 40, height: 40, borderRadius: 8, background: 'var(--mm-surface)', border: '1px solid var(--mm-border)' } }, h(M.Icon, { name: n, size: 22 }));
})));
</script>
</body>
</html>
