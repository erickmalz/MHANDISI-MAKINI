<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>HeroPanel — preview</title>
<style>body{margin:0;padding:16px;background:var(--mm-canvas);font-family:var(--mm-font-body);color:var(--mm-text)}</style></head>
<body>
<div id="root"></div>
<script>
var M = window.MhandisiMakini, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(M.HeroPanel, {
  title: 'Find a skilled expert', subtitle: 'Get trusted help for your next project.',
  trust: [{ icon: 'shield', label: 'Trusted professionals' }, { icon: 'users', label: 'Quality work' }, { icon: 'gear', label: 'Stronger communities' }] },
  h(M.TextField, { label: 'Search by service or location', hideLabel: true, icon: 'search', placeholder: 'Search by service or location' }),
  h(M.Button, { variant: 'primary', size: 'lg' }, 'Book an expert')));
</script>
</body>
