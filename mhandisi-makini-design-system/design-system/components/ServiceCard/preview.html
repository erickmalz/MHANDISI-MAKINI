<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ServiceCard — preview</title>
<style>body{margin:0;padding:16px;background:var(--mm-canvas);font-family:var(--mm-font-body);color:var(--mm-text)}</style></head>
<body>
<div id="root" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px"></div>
<script>
var M = window.MhandisiMakini, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(M.ServiceCard, { category: 'electrical' }), h(M.ServiceCard, { category: 'plumbing' }),
  h(M.ServiceCard, { category: 'building' }), h(M.ServiceCard, { category: 'finishing' })));
</script>
</body>
</html>
