<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components/bundle.css">

<script>
var M=window.MhandisiMakini,h=React.createElement;function S(t){return h('section',null,h('h2',null,t),[].slice.call(arguments,1))}
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
h(M.HeroPanel,{title:'Find a skilled expert',subtitle:'Get trusted help for your next project.',trust:[{icon:'shield',label:'Trusted professionals'},{icon:'users',label:'Quality work'},{icon:'gear',label:'Stronger communities'}]},h(M.TextField,{label:'Search',hideLabel:true,icon:'search',placeholder:'Search by service or location'}),h(M.Button,{size:'lg'},'Book an expert')),
