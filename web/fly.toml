# fly.toml app configuration file generated for mhandisi-makini on 2026-09-26T07:24:58Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'mhandisi-makini'
primary_region = 'jnb'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10

# Apply pending migrations before any machine runs the new code. A failed
# migration fails the release, and the deploy stops with the old version live.
[deploy]
  release_command = "node scripts/migrate.mjs"
