<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Survey sweep loader</title>
    <style>
      :root {
        --mm-yellow: #ffbe00;
        --mm-charcoal: #292d30;
        --mm-border: #e3e5e7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f6f7;
      }

      .survey-sweep-loader {
        display: grid;
        width: 152px;
        height: 152px;
        place-items: center;
      }

      .survey-sweep-loader__mark {
        position: relative;
        display: grid;
        width: 152px;
        height: 152px;
        place-items: center;
      }

      .survey-sweep-loader__orbit,
      .survey-sweep-loader__orbit-inner {
        position: absolute;
        inset: 0;
        border: 4px solid transparent;
        border-radius: 50%;
      }

      .survey-sweep-loader__orbit {
        border-top-color: var(--mm-yellow);
        border-right-color: var(--mm-yellow);
        animation: survey-orbit 1.8s linear infinite;
      }

      .survey-sweep-loader__orbit-inner {
        inset: 14px;
        border-bottom-color: var(--mm-charcoal);
        animation: survey-orbit 1.8s linear infinite reverse;
      }

      .survey-sweep-loader__symbol {
        position: relative;
        z-index: 1;
        width: 96px;
        height: 96px;
        object-fit: contain;
        animation: survey-settle 1.8s ease-in-out infinite;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes survey-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes survey-settle {
        0%,
        100% {
          transform: scale(0.94);
        }

        50% {
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .survey-sweep-loader__orbit,
        .survey-sweep-loader__orbit-inner,
        .survey-sweep-loader__symbol {
          animation: none;
        }

        .survey-sweep-loader__orbit {
          border-color: var(--mm-border);
          border-top-color: var(--mm-yellow);
        }
      }
    </style>
  </head>
  <body>
    <!-- Keep logo-symbol.png in the same folder as this file. -->
    <div class="survey-sweep-loader" role="status" aria-label="Loading">
      <div class="survey-sweep-loader__mark" aria-hidden="true">
        <span class="survey-sweep-loader__orbit"></span>
        <span class="survey-sweep-loader__orbit-inner"></span>
        <img
          class="survey-sweep-loader__symbol"
          src="./logo-symbol.png"
          alt=""
          width="96"
          height="96"
        />
      </div>
      <span class="sr-only">Loading. Please wait.</span>
    </div>
  </body>
</html>
